---
docker_monitoring_stack:
  # prometheus node-exporter
  - name: prometheus_node_exporter
    image: quay.io/prometheus/node-exporter:latest
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=[{{ k8s00_ipv6_network }}5]:9100'
      - '--web.listen-address=[{{ k8s00_ipv4_network }}5]:9100'
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    network_mode: host
    pid_mode: host
    volumes:
      - '/:/host:ro,rslave'

  # cadvisor
  - name: cadvisor
    image: ghcr.io/google/cadvisor:latest
    command:
      - '--listen_ip=[{{ k8s00_ipv6_network }}5]'
      - '--port=8888'
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    network_mode: host
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
