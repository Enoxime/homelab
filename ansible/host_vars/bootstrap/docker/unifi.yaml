---
docker_unifi_volumes:
  - name: unifi_config
  - name: unifi_mongo_data
docker_unifi_stack:
  # unifi_mongo
  - env:
      MONGO_INITDB_ROOT_PASSWORD: "{{ bootstrap.docker.unifi.mongo_root_password }}"
      MONGO_INITDB_ROOT_USERNAME: unifi
    image: docker.io/mongo:8
    name: unifi_mongo
    networks:
      - name: unifi
    volumes:
      - unifi_mongo_data:/data/db

  # unifi network application
  - env:
      MONGO_AUTHSOURCE: admin
      MONGO_DBNAME: unifi
      MONGO_HOST: unifi_mongo
      MONGO_PASS: "{{ bootstrap.docker.unifi.mongo_root_password }}"
      MONGO_PORT: "27017"
      MONGO_USER: unifi
      PGID: "1000"
      PUID: "1000"
      TZ: "{{ timezone }}"
    image: lscr.io/linuxserver/unifi-network-application:10.6.106
    name: unifi-network-application
    networks:
      - name: caddy
      - name: unifi
    ports:
      - "[{{ mgmt_ipv6_network }}5]:10001:10001/udp"
      - "{{ mgmt_ipv4_network }}5:10001:10001/udp"
      - "[{{ mgmt_ipv6_network }}5]:3478:3478/udp"
      - "{{ mgmt_ipv4_network }}5:3478:3478/udp"
      - "[{{ mgmt_ipv6_network }}5]:8080:8080"
      - "{{ mgmt_ipv4_network }}5:8080:8080"
      - "[{{ mgmt_ipv6_network }}5]:8443:8443"
    volumes:
      - unifi_config:/config
