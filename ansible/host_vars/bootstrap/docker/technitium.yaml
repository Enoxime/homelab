      - "[{{ service_ipv6_network }}53]:53:53/udp"
      - "{{ service_ipv4_network }}53:53:53"
      - "{{ service_ipv4_network }}53:53:53/udp"
    volumes:
      - technitium_service_config:/etc/dns
  - name: technitium-k8s00
