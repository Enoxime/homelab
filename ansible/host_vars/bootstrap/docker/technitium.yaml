---
docker_technitium_volumes:
  - name: technitium_mgmt_config
  - name: technitium_dmz_config
  - name: technitium_work_config
  - name: technitium_service_config
  - name: technitium_k8s00_config
  - name: technitium_casa_config
  - name: technitium_iot_config
  - name: technitium_monitoring_config
docker_technitium_stack:
  - name: technitium-mgmt
    image: docker.io/technitium/dns-server:15.6.2
    env:
      DNS_SERVER_DOMAIN: "dns1.mgmt.{{ home_domain }}"
      DNS_SERVER_ADMIN_PASSWORD: "{{ admin_password }}"
      DNS_SERVER_PREFER_IPV6: "true"
      # DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES: "[{{ mgmt_ipv6_network }}53],{{ mgmt_ipv4_network }}53"
      DNS_SERVER_ENABLE_BLOCKING: "true"
      DNS_SERVER_BLOCK_LIST_URLS: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
      DNS_SERVER_FORWARDERS: "[{{ mgmt_ipv6_nameserver }}],{{ mgmt_ipv4_nameserver }}"
      DNS_SERVER_FORWARDER_PROTOCOL: "Udp"
    networks:
      - name: caddy
    # network_mode: host
    ports:
      - "[{{ mgmt_ipv6_network }}53]:53:53"
      - "[{{ mgmt_ipv6_network }}53]:53:53/udp"
      - "{{ mgmt_ipv4_network }}53:53:53"
      - "{{ mgmt_ipv4_network }}53:53:53/udp"
    volumes:
      - technitium_mgmt_config:/etc/dns
  - name: technitium-dmz
    image: docker.io/technitium/dns-server:15.6.2
    env:
      DNS_SERVER_DOMAIN: "dns1.dmz.{{ home_domain }}"
      DNS_SERVER_ADMIN_PASSWORD: "{{ admin_password }}"
      DNS_SERVER_PREFER_IPV6: "true"
      DNS_SERVER_ENABLE_BLOCKING: "true"
      DNS_SERVER_BLOCK_LIST_URLS: "https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling-porn-social/hosts"
      DNS_SERVER_FORWARDERS: "[{{ gateway_ipv6 }}],{{ dmz_ipv4_network }}1"
      DNS_SERVER_FORWARDER_PROTOCOL: "Udp"
    networks:
      - name: caddy
    ports:
      - "[{{ dmz_ipv6_network }}53]:53:53"
      - "[{{ dmz_ipv6_network }}53]:53:53/udp"
      - "{{ dmz_ipv4_network }}53:53:53"
      - "{{ dmz_ipv4_network }}53:53:53/udp"
    volumes:
      - technitium_dmz_config:/etc/dns
  - name: technitium-work
    image: docker.io/technitium/dns-server:15.6.2
    env:
      DNS_SERVER_DOMAIN: "dns1.work.{{ home_domain }}"
      DNS_SERVER_ADMIN_PASSWORD: "{{ admin_password }}"
      DNS_SERVER_PREFER_IPV6: "true"
      DNS_SERVER_ENABLE_BLOCKING: "true"
      DNS_SERVER_BLOCK_LIST_URLS: "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
      DNS_SERVER_FORWARDERS: "[{{ gateway_ipv6 }}],{{ work_ipv4_network }}1"
      DNS_SERVER_FORWARDER_PROTOCOL: "Udp"
    networks:
      - name: caddy
    ports:
      - "[{{ work_ipv6_network }}53]:53:53"
      - "[{{ work_ipv6_network }}53]:53:53/udp"
      - "{{ work_ipv4_network }}53:53:53"
      - "{{ work_ipv4_network }}53:53:53/udp"
    volumes:
      - technitium_work_config:/etc/dns
  - name: technitium-service
