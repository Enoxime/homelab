ansible_host: "{{ inventory_hostname }}.{{ home_domain }}"
incusos_destination_path: "{{ project_full_path }}/incusos"
incusos_file_owner: "{{ ansible_user }}"
incusos_file_group: "{{ ansible_user }}"
incusos_incus:
  apply_defaults: true
  preseed:
    certificates:
      - name: homelab-bootstrap
        type: client
        certificate: "{{ bootstrap.certificate.crt }}"
incusos_install:
  force_install: true
  target:
    bus: nvme
    id: "{{ bootstrap.disk_path }}"
incusos_network:
  dns:
    hostname: "{{ inventory_hostname }}"
    domain: "mgmt.{{ home_domain }}"
    search_domains:
      - "mgmt.{{ home_domain }}"
      - "{{ home_domain }}"
      - "mgmt.{{ home_domain_old }}"
      - "{{ home_domain_old }}"
    nameservers:
      - "{{ mgmt_ipv4_nameserver }}"
      - "{{ mgmt_ipv6_nameserver }}"
  time:
    ntp_servers:
      - "{{ mgmt_ipv4_nameserver }}"
      - "{{ mgmt_ipv6_nameserver }}"
    timezone: "{{ timezone }}"
  interfaces:
    - name: mgmt
      hwaddr: eno1
      required_for_online: both
      roles:
        - management
        - instances
      addresses:
        - "{{ mgmt_ipv6_network }}5/64"
        - "{{ mgmt_ipv6_network }}10/64"
        - "{{ mgmt_ipv6_network }}53/64"
        - "{{ mgmt_ipv4_network }}5/24"
        - "{{ mgmt_ipv4_network }}10/24"
        - "{{ mgmt_ipv4_network }}53/24"
      routes:
        - to: ::/0
          via: "{{ mgmt_ipv6_nameserver }}"
        - to: 0.0.0.0/0
          via: "{{ mgmt_ipv4_nameserver }}"
      vlan_tags:
        - 10
        - 20
        - 30
        - 40
        - 50
        - 60
        - 70
  vlans:
    - name: dmz
      parent: mgmt
      id: 10
      roles:
        - instances
      addresses:
        - "{{ dmz_ipv6_network }}5/64"
        - "{{ dmz_ipv6_network }}10/64"
        - "{{ dmz_ipv6_network }}53/64"
        - "{{ dmz_ipv4_network }}5/24"
        - "{{ dmz_ipv4_network }}10/24"
        - "{{ dmz_ipv4_network }}53/24"
      routes:
        - to: "{{ dmz_ipv6_network }}/64"
          via: "{{ gateway_ipv6 }}"
        - to: "{{ dmz_ipv4_network }}0/24"
          via: "{{ dmz_ipv4_network }}1"
    - name: work
      parent: mgmt
      id: 20
      roles:
        - instances
      addresses:
        - "{{ work_ipv6_network }}5/64"
        - "{{ work_ipv6_network }}53/64"
        - "{{ work_ipv4_network }}5/24"
        - "{{ work_ipv4_network }}53/24"
      routes:
        - to: "{{ work_ipv6_network }}/64"
          via: "{{ gateway_ipv6 }}"
        - to: "{{ work_ipv4_network }}0/24"
          via: "{{ work_ipv4_network }}1"
    - name: service
      parent: mgmt
      id: 30
      roles:
        - instances
      addresses:
        - "{{ service_ipv6_network }}5/64"
        - "{{ service_ipv6_network }}10/64"
        - "{{ service_ipv6_network }}53/64"
        - "{{ service_ipv4_network }}5/24"
        - "{{ service_ipv4_network }}10/24"
        - "{{ service_ipv4_network }}53/24"
      routes:
        - to: "{{ service_ipv6_network }}/64"
          via: "{{ gateway_ipv6 }}"
        - to: "{{ service_ipv4_network }}0/24"
          via: "{{ service_ipv4_network }}1"
    - name: k8s00
      parent: mgmt
      id: 40
      roles:
        - instances
      addresses:
        - "{{ k8s00_ipv6_network }}5/64"
        - "{{ k8s00_ipv6_network }}10/64"
        - "{{ k8s00_ipv6_network }}53/64"
        - "{{ k8s00_ipv4_network }}5/24"
        - "{{ k8s00_ipv4_network }}10/24"
        - "{{ k8s00_ipv4_network }}53/24"
      routes:
        - to: "{{ k8s00_ipv6_network }}/64"
          via: "{{ gateway_ipv6 }}"
        - to: "{{ k8s00_ipv4_network }}0/24"
          via: "{{ k8s00_ipv4_network }}1"
    - name: casa
      parent: mgmt
      id: 50
      roles:
        - instances
      addresses:
        - "{{ casa_ipv6_network }}5/64"
        - "{{ casa_ipv6_network }}10/64"
        - "{{ casa_ipv6_network }}53/64"
        - "{{ casa_ipv4_network }}5/24"
        - "{{ casa_ipv4_network }}10/24"
        - "{{ casa_ipv4_network }}53/24"
      routes:
        - to: "{{ casa_ipv6_network }}/64"
          via: "{{ gateway_ipv6 }}"
        - to: "{{ casa_ipv4_network }}0/24"
          via: "{{ casa_ipv4_network }}1"
    - name: iot
      parent: mgmt
      id: 60
      roles:
        - instances
      addresses:
        - "{{ iot_ipv6_network }}5/64"
        - "{{ iot_ipv6_network }}53/64"
        - "{{ iot_ipv4_network }}5/24"
        - "{{ iot_ipv4_network }}53/24"
      routes:
        - to: "{{ iot_ipv6_network }}/64"
          via: "{{ gateway_ipv6 }}"
        - to: "{{ iot_ipv4_network }}0/24"
          via: "{{ iot_ipv4_network }}1"
    - name: monitoring
      parent: mgmt
      id: 70
      roles:
        - instances
      addresses:
        - "{{ monitoring_ipv6_network }}5/64"
        - "{{ monitoring_ipv6_network }}53/64"
        - "{{ monitoring_ipv4_network }}5/24"
        - "{{ monitoring_ipv4_network }}53/24"
      routes:
        - to: "{{ monitoring_ipv6_network }}/64"
          via: "{{ gateway_ipv6 }}"
        - to: "{{ monitoring_ipv4_network }}0/24"
          via: "{{ monitoring_ipv4_network }}1"
