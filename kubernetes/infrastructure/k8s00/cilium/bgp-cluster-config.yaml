---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: "k8s00-ipv6-64513"
      localASN: 64513
      peers:
        - name: "opnsense"
          peerASN: 64512
          peerAddress: "${bgpIpv6Router}"
          peerConfigRef:
            name: "cilium-peer"
    - name: "k8s00-ipv4-64513"
      localASN: 64513
      peers:
        - name: "opnsense"
          peerASN: 64512
          peerAddress: "${bgpIpv4Router}"
          peerConfigRef:
            name: "cilium-peer"
