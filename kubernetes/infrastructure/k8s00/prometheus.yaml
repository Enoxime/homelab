---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  install:
    createNamespace: true
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">= 91.4.1 < 92.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1440m
  values:
    crds:
      upgradeJob:
        enabled: true

    grafana:
      operator:
        ## Enable references to ConfigMaps containing dashboards in GrafanaDashboard CRs
        ## Set to true to allow dashboards to be loaded from ConfigMap references
        dashboardsConfigMapRefEnabled: false
      defaultDashboardsTimezone: ${timezone}
      ## Configure additional grafana datasources (passed through tpl)
      ## ref: https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources
      additionalDataSources: []
      # - name: prometheus-sample
      #   access: proxy
      #   basicAuth: true
      #   secureJsonData:
      #       basicAuthPassword: pass
      #   basicAuthUser: daco
      #   editable: false
      #   jsonData:
      #       tlsSkipVerify: true
      #   orgId: 1
      #   type: prometheus
      #   url: https://{{ printf "%s-prometheus.svc" .Release.Name }}:9090
      #   version: 1
      persistence:
        enabled: true
        type: sts
        storageClassName: rook-ceph-retain
        accessModes:
          - ReadWriteOnce
        size: 10Gi
      admin:
        ## Name of the secret. Can be templated.
        existingSecret: ""
        userKey: admin-user
        passwordKey: admin-password
      ## Configure grafana dashboard providers
      ## ref: http://docs.grafana.org/administration/provisioning/#dashboards
      ##
      ## `path` must be /var/lib/grafana/dashboards/<provider_name>
      ##
      # dashboardProviders:
      #   dashboardproviders.yaml:
      #     apiVersion: 1
      #     providers:
      #       - name: 'default'
      #         orgId: 1
      #         folder: ''
      #         type: file
      #         disableDeletion: false
      #         editable: true
      #         options:
      #           path: /var/lib/grafana/dashboards/default
      #  dashboardproviders.yaml:
      #    apiVersion: 1
      #    providers:
      #    - name: 'default'
      #      orgId: 1
      #      folder: ''
      #      type: file
      #      disableDeletion: false
      #      editable: true
      #      options:
      #        path: /var/lib/grafana/dashboards/default
      ## Configure grafana dashboard to import
      ## NOTE: To use dashboards you must also enable/configure dashboardProviders
      ## ref: https://grafana.com/dashboards
      ##
      ## dashboards per provider, use provider name as key.
      ## For dashboards downloaded via gnetId or url, the optional "title" key overrides
      ## the dashboard title in the downloaded JSON so the UI displays your custom title.
      ##
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          docker-dashboard:
            url: https://grafana.com/api/dashboards/10585/revisions/1/download
            curlOptions: "-sL"
          linux-hosts-dashboard:
            url: https://grafana.com/api/dashboards/10180/revisions/1/download
            curlOptions: "-sL"
          certificate-expiration-dashboard:
            url: https://grafana.com/api/dashboards/13922/revisions/4/download
            curlOptions: "-sL"
        # default:
        #   some-dashboard:
        #     json: |
        #       $RAW_JSON
        #   custom-dashboard:
        #     file: dashboards/custom-dashboard.json
        #   prometheus-stats:
        #     title: My Custom Dashboard Title   # optional; overrides the dashboard title in the downloaded JSON
        #     gnetId: 2
        #     revision: 2
        #     datasource: Prometheus
        #   local-dashboard:
        #     url: https://example.com/repository/test.json
        #     curlOptions: "-sLf"
        #     token: ''
        #   local-dashboard-base64:
        #     url: https://example.com/repository/test-b64.json
        #     token: ''
        #     b64content: true
        #   local-dashboard-gitlab:
        #     url: https://example.com/repository/test-gitlab.json
        #     gitlabToken: ''
        #   local-dashboard-bitbucket:
        #     url: https://example.com/repository/test-bitbucket.json
        #     bearerToken: ''
        #   local-dashboard-azure:
        #     url: https://example.com/repository/test-azure.json
        #     basic: ''
        #     acceptHeader: '*/*'

    kubeControllerManager:
      enabled: true
      service:
        selector:
          k8s-app: kube-controller-manager

    kubeEtcd:
      enabled: true
      service:
        selector:
          # Fix selector for kube-etcd for Talos
          # (set itentionally to kube-controller-manager because all master nodes has the same roles)
          k8s-app: kube-controller-manager
      serviceMonitor:
        enabled: true
        # Add nodename label
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            separator: ;
            regex: ^(.*)$
            targetLabel: nodename
            replacement: $1
            action: replace
        # Remove pod label
        metricRelabelings:
          - action: labeldrop
            regex: pod

    kubeScheduler:
      enabled: true
      service:
        selector:
          k8s-app: kube-controller-manager

    kubeProxy:
      enabled: false

    prometheusOperator:
      admissionWebhooks:
        certManager:
          enabled: true

    prometheus:
      prometheusSpec:
        replicas: 2
        podAntiAffinity: "hard"
        ## If true, a nil or {} value for prometheus.prometheusSpec.serviceMonitorSelector will cause the
        ## prometheus resource to be created with selectors based on values in the helm deployment,
        ## which will also match the servicemonitors created
        ##
        serviceMonitorSelectorNilUsesHelmValues: false

        ## ServiceMonitors to be selected for target discovery.
        ## If {}, select all ServiceMonitors
        ##
        serviceMonitorSelector: {}
        ## Example which selects ServiceMonitors with label "prometheus" set to "somelabel"
        # serviceMonitorSelector:
        #   matchLabels:
        #     prometheus: somelabel

        ## Namespaces to be selected for ServiceMonitor discovery.
        ##
        serviceMonitorNamespaceSelector: {}
        ## Example which selects ServiceMonitors in namespaces with label "prometheus" set to "somelabel"
        # serviceMonitorNamespaceSelector:
        #   matchLabels:
        #     prometheus: somelabel

        ## If true, a nil or {} value for prometheus.prometheusSpec.podMonitorSelector will cause the
        ## prometheus resource to be created with selectors based on values in the helm deployment,
        ## which will also match the podmonitors created
        ##
        podMonitorSelectorNilUsesHelmValues: false

        ## PodMonitors to be selected for target discovery.
        ## If {}, select all PodMonitors
        ##
        podMonitorSelector: {}
        ## Example which selects PodMonitors with label "prometheus" set to "somelabel"
        # podMonitorSelector:
        #   matchLabels:
        #     prometheus: somelabel

        ## If nil, select own namespace. Namespaces to be selected for PodMonitor discovery.
        podMonitorNamespaceSelector: {}
        ## Example which selects PodMonitor in namespaces with label "prometheus" set to "somelabel"
        # podMonitorNamespaceSelector:
        #   matchLabels:
        #     prometheus: somelabel

        volumes:
          - name: scrape-secrets
            secret:
              secretName: scrape-secrets

        volumeMounts:
          - name: scrape-secrets
            readOnly: true
            mountPath: /etc/prometheus/secrets/scrape-secrets

        additionalScrapeConfigs:
          - job_name: incus
            metrics_path: '/1.0/metrics'
            scheme: 'https'
            static_configs:
              - targets: ['bootstrap.${k8s00Domain}:8443']
            tls_config:
              ca_file: '/etc/prometheus/secrets/scrape-secrets/bootstrap-client.crt'
              cert_file: '/etc/prometheus/secrets/scrape-secrets/bootstrap-metrics.crt'
              key_file: '/etc/prometheus/secrets/scrape-secrets/bootstrap-metrics.key'
              server_name: 'bootstrap.${mgmtDomain}'
          - job_name: flatcar-node
            static_configs:
              - targets: ['bootstrap.${k8s00Domain}:9100']
          - job_name: flatcar-cadvisor
            static_configs:
              - targets: ['bootstrap.${k8s00Domain}:8888']
