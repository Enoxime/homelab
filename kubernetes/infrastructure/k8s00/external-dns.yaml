---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: cert-manager
spec:
  interval: 1440m
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-k8s00
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns
      version: ">=1.23.0 <1.24.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: cert-manager
      interval: 1m
  values:
    domainFilters:
      - ${k8s00Domain}
      - ${k8s00PtrIpv6}
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            key: tsig-secret
            name: homelab-k8s00-tsig
    extraArgs:
      - --pihole-api-version=6
      - --pihole-server=${piholeUrlMgmtBootstrap00Internal}
      - --rfc2136-host=dns1.${k8s00Domain}
      - --rfc2136-port=53
      - --rfc2136-zone=${k8s00Domain}
      - --rfc2136-zone=${k8s00PtrIpv6}
      - --rfc2136-tsig-keyname=k8s00-cert-manager
      - --rfc2136-tsig-secret-alg=hmac-sha512
      - --rfc2136-axfr
      - --create-ptr
      - --managed-record-types=A
      - --managed-record-types=AAAA
      - --managed-record-types=CNAME
      - --managed-record-types=PTR
    interval: 1m
    namespaced: false
    provider:
      name: rfc2136
    replicaCount: 1
    service:
      enabled: true
      ipFamilies:
        - IPv6
        - IPv4
      ipFamilyPolicy: RequireDualStack
    serviceMonitor:
      enabled: true
    sources:
      - service
      - gateway-httproute
