apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    releaseName: cilium
    namespace: kube-system
    version: 1.20.5
    valuesInline:
      ipam:
        mode: kubernetes
        operator:
          clusterPoolIPv6PodCIDRList:
            - "fdff::/104"
      kubeProxyReplacement: true
      securityContext:
        capabilities:
          ciliumAgent:
            - CHOWN
            - KILL
            - NET_ADMIN
            - NET_RAW
            - IPC_LOCK
            - SYS_ADMIN
            - SYS_RESOURCE
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYSLOG
          cleanCiliumState:
            - NET_ADMIN
            - SYS_ADMIN
            - SYS_RESOURCE
      cgroup:
        autoMount:
          enabled: false
        hostRoot: /sys/fs/cgroup
      k8sServiceHost: localhost
      k8sServicePort: 7445
      k8s:
        requireIPv6PodCIDR: true
      cni:
        exclusive: false
      devices: br0
      ipv4:
        enabled: false
      ipv6:
        enabled: true
      bgpControlPlane:
        enabled: true
