---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: two-times-a-day-pg18
  namespace: immich
spec:
  suspend: false
  immediate: true
  schedule: "0 0 0,12 * * *"
  cluster:
    name: immich-pg-18
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage-home-immich
  namespace: immich
spec:
  configuration:
    destinationPath: s3://k8s00-cnpg-backup
    s3Credentials:
      accessKeyId:
        name: cnpg-immich-pg-backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-immich-pg-backup-creds
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-immich-pg-backup-creds
        key: region
    endpointURL: http://garage.garage:3900
    wal:
      compression: gzip
      maxParallel: 8
    data:
      compression: gzip
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg-18
  namespace: immich
spec:
  description: Main database for immich
  # inheritedMetadata:
  #   labels:
  #   annotations:
  # See: https://docs.immich.app/administration/postgres-standalone/#prerequisites
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: vectorchord
    major: 18
  postgresUID: 26
  postgresGID: 26
  instances: 3
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  bootstrap:
    initdb:
      # import:
      #   type: microservice
      #   databases:
      #     - immich
      #   source:
      #     externalCluster: immich-pg-17
      database: immich
      postInitApplicationSQL:
        # Commands based on: https://immich.app/docs/administration/postgres-standalone/#without-superuser-permission
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
      owner: immich
      secret:
        name: immich-postgres-credentials
      dataChecksums: true
      encoding: 'UTF8'
  enableSuperuserAccess: true
  storage:
    size: 8Gi
    storageClass: rook-ceph-retain
  walStorage:
    size: 8Gi
    storageClass: rook-ceph-retain
  resources: {}
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  monitoring:
    disableDefaultQueries: false
  enablePDB: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-home-immich
