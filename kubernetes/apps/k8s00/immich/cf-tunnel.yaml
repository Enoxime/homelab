apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-cloudflared
  namespace: immich
spec:
  replicas: 2
  selector:
    matchLabels:
      pod: cloudflared
  template:
    metadata:
      labels:
        pod: cloudflared
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              pod: cloudflared
      securityContext:
        fsGroup: 1000
      containers:
        - image: cloudflare/cloudflared:latest
          name: cloudflared
          envFrom:
            - secretRef:
                name: cf-tunnel-token
          env:
            - name: TUNNEL_EDGE_IP_VERSION
              value: "6"
          command:
            # Configures tunnel run parameters
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - "[::]:2000"
            - run
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: immich-cloudflared
  namespace: immich
spec:
  minAvailable: 1
  selector:
    matchLabels:
      pod: cloudflared
