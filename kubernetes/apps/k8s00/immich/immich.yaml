---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: homelab
        namespace: flux-system
      interval: 1m
  values:
    image:
      tag: v3.4.2

    network:
      dualStack:
        enabled: false

    securityContext:
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: ${userId}
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault

    httpRoute:
      enabled: true
      parentRefs:
        - name: homelab-k8s00-wildcard
          namespace: gateway
          sectionName: https
      hostnames:
        - "immich.service.${k8s00Domain}"

    persistence:
      enabled: true
      storageClassName: rook-ceph-retain
      upload:
        enabled: true
        existingClaim:
          name: immich-upload
      library:
        enabled: true
        existingClaim:
          name: immich-library

    volumes:
      - name: upload
        persistentVolumeClaim:
          claimName: immich-upload
      - name: library
        persistentVolumeClaim:
          claimName: immich-library

    volumeMounts:
      - name: upload
        mountPath: /usr/src/app/upload
      - name: library
        mountPath: /usr/src/app/library

    timezone: ${timezone}

    monitoring:
      enabled: true
      serviceMonitor:
        enabled: true

    ai:
      enabled: true
      image:
        tag: v3.4.2-cuda
      persistence:
        storageClassName: rook-ceph-delete
        cacheSize: 50Gi
        configSize: 1Gi
      runtimeClass:
        enabled: true
        name: nvidia
      resources:
        limits:
          nvidia.com/gpu: 1
      podSecurityContext:
        fsGroup: ${groupId}
      securityContext:
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        runAsUser: ${userId}
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      service:
        type: ClusterIP
        port: 3003

    microservices:
      resources:
        limits:
          nvidia.com/gpu: 8

    ipp:
      enabled: true
      image:
        repository: alangrainger/immich-public-proxy
        pullPolicy: IfNotPresent
        tag: "4.1.2"
      podSecurityContext:
        fsGroup: ${groupId}
      securityContext:
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: ${userId}
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      publicBaseUrl:
        enabled: true
        url: https://photos.${mainDomainOld}
      config:
        enabled: true
        ipp:
          gallery:
            singleImage: true
          maxDownloadQuality: fullsize
          allowDownload: 1

    postgresql:
      hostname: immich-pg-18-rw
      username: immich
      databaseName: immich
      password:
        name: immich
        key: pg_password

    redis:
      hostname: immich-valkey
      username: immich
      password:
        name: immich
        key: redis_password
